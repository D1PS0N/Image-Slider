<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Photo Gallery Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>My Photo Gallery Slider</h1>
      <p>Week 4 project: a custom image slider with smooth sliding and endless looping</p>
    </header>

    <section class="slider" id="image-slider" aria-roledescription="carousel" aria-label="Photo gallery slider">

      <div class="slider-viewport">
        <ul class="slider-track" id="sliderTrack">
          <li class="slide">
            <img src="Images/image%201.jpg" alt="Sun setting over calm water" />
            <p class="slide-caption">Sunset over the water</p>
          </li>
          <li class="slide">
            <img src="Images/image%202.jpg" alt="Purple and pink clouds over dark mountains at dusk" />
            <p class="slide-caption">Dusk sky over the mountains</p>
          </li>
          <li class="slide">
            <img src="Images/image%203.jpg" alt="Layers of green mountain valleys under a cloudy blue sky" />
            <p class="slide-caption">Green mountain valleys</p>
          </li>
          <li class="slide">
            <img src="Images/image%204.jpg" alt="Bright moon over dark mountains at night" />
            <p class="slide-caption">Moonlit mountains at night</p>
          </li>
          <li class="slide">
            <img src="Images/image%205.jpg" alt="Fog drifting over a forested mountain slope" />
            <p class="slide-caption">Fog over the forest</p>
          </li>
        </ul>
      </div>

      <button class="slider-arrow slider-arrow--prev" id="prevBtn" type="button" aria-label="Previous slide">&#10094;</button>
      <button class="slider-arrow slider-arrow--next" id="nextBtn" type="button" aria-label="Next slide">&#10095;</button>

      <!-- Indicator dots are generated dynamically by slider.js -->
      <div class="slider-dots" id="sliderDots" aria-label="Choose slide"></div>

    </section>
  </main>

  <script src="slider.js"></script>
</body>
</html>
